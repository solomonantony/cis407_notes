<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
</head>
<body>
    <h1>Edit Student</h1>
    <a href="/students">Back to Students</a>

    <form action="/students/save" method="POST">

        <!-- Hidden field carries the primary key so the route knows which row to update -->
        <input type="hidden" name="std_no" value="{{ student[0] }}">

        <p>
            <label>Student No:</label>
            <input type="text" value="{{ student[0] }}" readonly>
        </p>
        <p>
            <label>First Name:</label>
            <input type="text" name="first_name" value="{{ student[1] }}">
        </p>
        <p>
            <label>Last Name:</label>
            <input type="text" name="last_name" value="{{ student[2] }}">
        </p>
        <p>
            <label>City:</label>
            <input type="text" name="city" value="{{ student[3] }}">
        </p>
        <p>
            <label>State:</label>
            <input type="text" name="state" value="{{ student[4] }}">
        </p>
        <p>
            <label>Zip:</label>
            <input type="text" name="zip" value="{{ student[5] }}">
        </p>
        <p>
            <label>Major:</label>
            <input type="text" name="major" value="{{ student[6] }}">
        </p>
        <p>
            <label>Class:</label>
            <input type="text" name="std_class" value="{{ student[7] }}">
        </p>
        <p>
            <label>GPA:</label>
            <input type="text" name="gpa" value="{{ student[8] }}">
        </p>

        <p>
            <button type="submit">Save</button>
        </p>

    </form>
</body>
</html>
